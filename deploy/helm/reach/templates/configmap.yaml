apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "reach.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reach.labels" . | nindent 4 }}
data:
  # Non-secret runtime config, injected as env vars (keys == env var names).
  STORAGE_BACKEND: {{ .Values.config.storageBackend | quote }}
  AUDIT_RETENTION_DAYS: {{ .Values.config.auditRetentionDays | quote }}
  {{- $rateUri := include "reach.rateLimitUri" . }}
  {{- with $rateUri }}
  # Bundled Redis/Valkey when enabled, else config.rateLimitStorageUri. Absent = in-process limits.
  RATE_LIMIT_STORAGE_URI: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.awsRegion }}
  # DynamoDB backend (AWS): region for the boto3 client. Credentials come from IRSA - annotate
  # the ServiceAccount with eks.amazonaws.com/role-arn (serviceAccount.annotations).
  AWS_REGION: {{ . | quote }}
  AWS_DEFAULT_REGION: {{ . | quote }}
  {{- end }}
