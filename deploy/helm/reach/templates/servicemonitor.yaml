{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "reach.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reach.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "reach.backend.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      {{- if .Values.config.metricsToken }}
      # /metrics is protected by METRICS_TOKEN; give Prometheus the same bearer token.
      authorization:
        credentials:
          name: {{ include "reach.secretName" . }}
          key: METRICS_TOKEN
      {{- end }}
{{- end }}
