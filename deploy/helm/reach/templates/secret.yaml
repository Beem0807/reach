{{- if not .Values.config.existingSecret }}
{{- if not (include "reach.isDynamo" .) }}
{{- if and (not .Values.config.databaseUrl) (not .Values.postgresql.enabled) }}
{{ fail "A database is required: set config.databaseUrl, OR enable the bundled DB (postgresql.enabled=true), OR use DynamoDB (config.storageBackend=dynamo), OR provide config.existingSecret" }}
{{- end }}
{{- end }}
{{- if not .Values.config.tokenPepper }}{{ fail "config.tokenPepper is required (or set config.existingSecret). Generate a stable value, e.g. openssl rand -hex 32" }}{{- end }}
{{- if not .Values.config.sessionSigningKey }}{{ fail "config.sessionSigningKey is required (or set config.existingSecret)" }}{{- end }}
{{- if not .Values.config.adminPassword }}{{ fail "config.adminPassword is required (or set config.existingSecret)" }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reach.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reach.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Keys are the exact env var names the backend reads. If you supply your own Secret via
  # config.existingSecret, use these same keys.
  {{- with .Values.config.databaseUrl }}
  # Only an EXTERNAL Postgres URL lives here. The bundled Postgres provides DATABASE_URL from its
  # own Secret (which owns the generated password); DynamoDB needs no DATABASE_URL at all.
  DATABASE_URL: {{ . | quote }}
  {{- end }}
  TOKEN_PEPPER: {{ .Values.config.tokenPepper | quote }}
  SESSION_SIGNING_KEY: {{ .Values.config.sessionSigningKey | quote }}
  ADMIN_PASSWORD: {{ .Values.config.adminPassword | quote }}
  {{- with .Values.config.metricsToken }}
  METRICS_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
