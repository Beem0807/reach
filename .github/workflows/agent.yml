# Agent pipeline. Triggers ONLY when agent-related paths change (never for backend/cli).
# Code lives under agent/**, the Helm chart under deploy/helm/reach-agent.
#
#   PR into main  -> run the version-bump `checks` + the agent `test`s. Nothing is published.
#   Push to main  -> checks + tests run, and only if they pass the `release` job publishes,
#                    signs, attests, and cuts a GitHub Release - but only for what changed:
#       * code (agent/**): needs a NEW agentVersion (agent/main.go) AND a chart bump with
#         appVersion updated to match agentVersion (also checked by agent/version_test.go).
#         Publishes the multi-arch image (cosign-signed, SBOM + SLSA provenance), the host
#         binaries + install.sh + versions.json to S3, and the chart; then a signed GitHub
#         Release. Tags agent-<ver> + agent-helm-<chartVer>.
#       * chart-only (deploy/helm/reach-agent/**): reuses the image; publishes just the chart +
#         a signed GitHub Release. Tags agent-helm-<chartVer>.
#
# Release logic is inlined (mirrors the former scripts/release_agent*.sh). See SUPPORT.md for
# how to verify signatures, checksums, SBOMs, and provenance.
# Required config: secrets DOCKERHUB_USERNAME, DOCKERHUB_TOKEN; and AWS_ROLE_ARN (the IAM role
# assumed via GitHub OIDC - no long-lived AWS keys). The AWS account needs a GitHub OIDC provider
# and that role's trust policy scoped to this repo.
name: Agent

on:
  pull_request:
    branches: [main]
    paths: ["agent/**", "deploy/helm/reach-agent/**"]
  push:
    branches: [main]
    paths: ["agent/**", "deploy/helm/reach-agent/**"]

concurrency:
  # Cancel superseded PR runs; serialize (never cancel) releases on main.
  group: agent-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write # release job pushes git tags + creates GitHub Releases
  id-token: write # OIDC: assume the AWS role + keyless cosign / attestations
  attestations: write # SLSA build-provenance attestations

env:
  BUCKET: reach-releases # S3 bucket the CI writes artifacts to
  RELEASES_BASE_URL: https://releases.reach.nabeem.com # CDN the artifacts are read from (chart index URLs)
  IMAGE: nabeemdev/reach-agent

jobs:
  # Version-bump guard. Runs on PRs too, so a forgotten version/chart bump (or a version that
  # was already released) is caught at PR time - the author fixes it before merge. Runs again on
  # merge, and its outputs (what changed + the versions) feed the release job so nothing is
  # recomputed. Credential-free: just git + file reads.
  checks:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changed.outputs.code }}
      chart: ${{ steps.changed.outputs.chart }}
      agent: ${{ steps.ver.outputs.agent }}
      chartver: ${{ steps.ver.outputs.chart }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect what changed (code vs chart)
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE=$(git rev-parse HEAD^ 2>/dev/null || echo "")
            fi
          fi
          if [ -n "$BASE" ]; then CHANGED=$(git diff --name-only "$BASE" HEAD); else CHANGED=$(git ls-files); fi
          echo "changed files:"; echo "$CHANGED"
          code=false; chart=false
          echo "$CHANGED" | grep -qE '^agent/'                   && code=true
          echo "$CHANGED" | grep -qE '^deploy/helm/reach-agent/' && chart=true
          echo "code=$code"   >> "$GITHUB_OUTPUT"
          echo "chart=$chart" >> "$GITHUB_OUTPUT"
      - name: Read versions
        id: ver
        run: |
          AGENT_VER=$(grep 'agentVersion' agent/main.go | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          CHART_VER=$(grep -E '^version:'  deploy/helm/reach-agent/Chart.yaml | head -1 | awk '{print $2}' | tr -d '"')
          APP_VER=$(grep -E '^appVersion:' deploy/helm/reach-agent/Chart.yaml | head -1 | awk '{print $2}' | tr -d '"')
          echo "agent=$AGENT_VER" >> "$GITHUB_OUTPUT"
          echo "chart=$CHART_VER" >> "$GITHUB_OUTPUT"
          echo "app=$APP_VER"     >> "$GITHUB_OUTPUT"
          echo "agent=$AGENT_VER  chart=$CHART_VER  appVersion=$APP_VER"
      - name: Version-bump + tag existence check
        env:
          CODE: ${{ steps.changed.outputs.code }}
          CHART_CHANGED: ${{ steps.changed.outputs.chart }}
          AGENT_VER: ${{ steps.ver.outputs.agent }}
          CHART_VER: ${{ steps.ver.outputs.chart }}
          APP_VER: ${{ steps.ver.outputs.app }}
        run: |
          tag_exists() { git ls-remote --exit-code --tags origin "refs/tags/$1" >/dev/null 2>&1; }
          fail() { echo "::error::$1"; exit 1; }
          if [ "$CODE" = "true" ]; then
            [ "$APP_VER" = "$AGENT_VER" ] || fail "chart appVersion ($APP_VER) must equal agentVersion ($AGENT_VER) - update deploy/helm/reach-agent/Chart.yaml appVersion"
            tag_exists "agent-$AGENT_VER"      && fail "agent code changed but tag agent-$AGENT_VER already exists - bump agentVersion in agent/main.go (and chart appVersion)"
            tag_exists "agent-helm-$CHART_VER" && fail "agent code changed but tag agent-helm-$CHART_VER already exists - bump 'version:' in deploy/helm/reach-agent/Chart.yaml too"
          elif [ "$CHART_CHANGED" = "true" ]; then
            tag_exists "agent-helm-$CHART_VER" && fail "agent chart changed but tag agent-helm-$CHART_VER already exists - bump 'version:' in deploy/helm/reach-agent/Chart.yaml"
          else
            echo "no agent code or chart change detected"
          fi
          echo "version-bump check passed"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: agent/go.sum
      - run: go test ./... -count=1 -timeout 120s
        working-directory: agent

  # Publish + sign + attest + release. Merge to main only, after checks + tests pass. Consumes
  # checks' outputs so nothing is recomputed. All release artifacts are staged into $DIST, which
  # the shared release-integrity action checksums, signs, attests, and attaches to the Release.
  release:
    needs: [checks, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CODE: ${{ needs.checks.outputs.code }}
      CHART_CHANGED: ${{ needs.checks.outputs.chart }}
      AGENT_VER: ${{ needs.checks.outputs.agent }}
      CHART_VER: ${{ needs.checks.outputs.chartver }}
      DIST: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v4 # for the build context and to push tags

      # ---- Tooling + credentials.
      - uses: actions/setup-go@v5
        if: needs.checks.outputs.code == 'true'
        with:
          go-version: "1.24"
          cache-dependency-path: agent/go.sum
      - uses: azure/setup-helm@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/setup-qemu-action@v3
        if: needs.checks.outputs.code == 'true'
      - uses: docker/setup-buildx-action@v3
        if: needs.checks.outputs.code == 'true'
      - name: Docker Hub login
        if: needs.checks.outputs.code == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: mkdir -p "$DIST"

      # ---- Artifact existence check (on top of the tag check in `checks`): never overwrite the
      #      immutable image / host binaries / chart tgz for this version. Mutable pointers
      #      (:latest, agent/latest/, versions.json) are intentionally not checked.
      - name: Ensure this version's artifacts don't already exist
        run: |
          fail() { echo "::error::$1"; exit 1; }
          s3_exists() { [ -n "$(aws s3 ls "$1" 2>/dev/null)" ]; }
          if [ "$CODE" = "true" ]; then
            docker buildx imagetools inspect "$IMAGE:$AGENT_VER" >/dev/null 2>&1 \
              && fail "image $IMAGE:$AGENT_VER already exists in the registry - bump agentVersion in agent/main.go"
            s3_exists "s3://$BUCKET/agent/v$AGENT_VER/" \
              && fail "host binaries agent/v$AGENT_VER/ already exist in S3 - bump agentVersion in agent/main.go"
          fi
          if [ "$CODE" = "true" ] || [ "$CHART_CHANGED" = "true" ]; then
            s3_exists "s3://$BUCKET/charts/reach-agent/reach-agent-$CHART_VER.tgz" \
              && fail "chart reach-agent-$CHART_VER.tgz already exists in S3 - bump 'version:' in deploy/helm/reach-agent/Chart.yaml"
          fi
          echo "no conflicting artifacts for this version"

      # ---- Image (multi-arch) -> registry, then keyless signature + SBOM attestation + provenance.
      - name: Build + push agent image
        if: needs.checks.outputs.code == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: agent
          file: agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.AGENT_VER }}
            ${{ env.IMAGE }}:latest
      - name: Sign image (keyless cosign)
        if: needs.checks.outputs.code == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Image SBOM (SPDX)
        if: needs.checks.outputs.code == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/image-sbom.spdx.json
          upload-artifact: false
      - name: Attach SBOM to image (cosign attest)
        if: needs.checks.outputs.code == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate "$RUNNER_TEMP/image-sbom.spdx.json" "$IMAGE@$DIGEST"
      - name: Image SLSA provenance attestation
        if: needs.checks.outputs.code == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}

      # ---- Host binaries + version-baked install.sh + versions.json -> S3 (and staged into $DIST).
      - name: Build + upload host binaries, install.sh, versions.json
        if: needs.checks.outputs.code == 'true'
        working-directory: agent
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            os=${target%/*}; arch=${target#*/}
            echo "building $os/$arch..."
            GOOS=$os GOARCH=$arch go build -o "reach-agent-$os-$arch" .
          done
          sed "s|__AGENT_VERSION__|agent/v${AGENT_VER}|" install.sh > /tmp/install-versioned.sh
          sed "s|__AGENT_VERSION__|agent/latest|"        install.sh > /tmp/install-latest.sh
          # Stage the release artifacts for checksums + the GitHub Release.
          cp reach-agent-linux-amd64 reach-agent-linux-arm64 reach-agent-darwin-arm64 reach-agent-darwin-amd64 "$DIST/"
          cp /tmp/install-versioned.sh "$DIST/install.sh"
          # S3 (versioned + latest).
          for dest in "agent/v${AGENT_VER}" "agent/latest"; do
            for f in reach-agent-linux-amd64 reach-agent-linux-arm64 reach-agent-darwin-arm64 reach-agent-darwin-amd64; do
              aws s3 cp "$f" "s3://$BUCKET/$dest/$f"
            done
          done
          aws s3 cp /tmp/install-versioned.sh "s3://$BUCKET/agent/v${AGENT_VER}/install.sh"
          aws s3 cp /tmp/install-latest.sh    "s3://$BUCKET/agent/latest/install.sh"
          # versions.json: the plain-HTTP index the create UI reads. Merge, dedupe, newest-first.
          EXISTING=$(aws s3 cp "s3://$BUCKET/agent/versions.json" - 2>/dev/null || echo '[]')
          printf '%s' "$EXISTING" | jq --arg v "$AGENT_VER" \
            '(. + [$v]) | unique | sort_by(split(".") | map(tonumber? // 0)) | reverse' > /tmp/versions.json
          aws s3 cp /tmp/versions.json "s3://$BUCKET/agent/versions.json" --content-type application/json

      # ---- Chart -> S3 (and staged into $DIST).
      - name: Publish agent chart
        if: needs.checks.outputs.code == 'true' || needs.checks.outputs.chart == 'true'
        run: |
          CHART_DIR=deploy/helm/reach-agent
          REPO_PATH="charts/reach-agent"
          REPO_URL="$RELEASES_BASE_URL/$REPO_PATH"
          helm lint "$CHART_DIR" --strict
          WORK=$(mktemp -d)
          helm package "$CHART_DIR" -d "$WORK"
          cp "$WORK/reach-agent-$CHART_VER.tgz" "$DIST/"
          if aws s3 cp "s3://$BUCKET/$REPO_PATH/index.yaml" "$WORK/old-index.yaml" >/dev/null 2>&1; then
            helm repo index "$WORK" --url "$REPO_URL" --merge "$WORK/old-index.yaml"
          else
            helm repo index "$WORK" --url "$REPO_URL"
          fi
          aws s3 cp "$WORK/reach-agent-$CHART_VER.tgz" "s3://$BUCKET/$REPO_PATH/reach-agent-$CHART_VER.tgz"
          aws s3 cp "$WORK/index.yaml"                 "s3://$BUCKET/$REPO_PATH/index.yaml"

      # ---- Tag the repo (before the GitHub Release, which attaches to the tag).
      - name: Tag the repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          push_tag() { git tag -a "$1" -m "$2" && git push origin "$1"; echo "tagged $1"; }
          if [ "$CODE" = "true" ]; then
            push_tag "agent-$AGENT_VER"      "Agent $AGENT_VER"
            push_tag "agent-helm-$CHART_VER" "Agent chart $CHART_VER"
          elif [ "$CHART_CHANGED" = "true" ]; then
            push_tag "agent-helm-$CHART_VER" "Agent chart $CHART_VER"
          fi

      - name: Choose release tag + SBOM source
        id: rel
        run: |
          if [ "$CODE" = "true" ]; then
            echo "tag=agent-$AGENT_VER" >> "$GITHUB_OUTPUT"
            echo "sbom=agent"           >> "$GITHUB_OUTPUT"
          else
            echo "tag=agent-helm-$CHART_VER" >> "$GITHUB_OUTPUT"
            echo "sbom="                     >> "$GITHUB_OUTPUT"
          fi

      # ---- Checksums + SBOM + keyless signature + provenance + GitHub Release for the staged files.
      - name: Release integrity
        uses: ./.github/actions/release-integrity
        with:
          tag: ${{ steps.rel.outputs.tag }}
          artifacts-dir: ${{ env.DIST }}
          sbom-source: ${{ steps.rel.outputs.sbom }}
          notes: |
            Signed release. Container image `${{ env.IMAGE }}:${{ env.AGENT_VER }}` is cosign-signed
            (keyless) with an SPDX SBOM and SLSA provenance. Host binaries + install.sh are covered
            by the signed `SHA256SUMS`. See SUPPORT.md → "Verifying a release".

      # ---- Publish the signed checksums to S3 so install.sh can verify downloads.
      - name: Upload checksums + signature to S3
        if: needs.checks.outputs.code == 'true'
        run: |
          for dest in "agent/v${AGENT_VER}" "agent/latest"; do
            aws s3 cp "$DIST/SHA256SUMS"     "s3://$BUCKET/$dest/SHA256SUMS"
            aws s3 cp "$DIST/SHA256SUMS.sig" "s3://$BUCKET/$dest/SHA256SUMS.sig"
            aws s3 cp "$DIST/SHA256SUMS.pem" "s3://$BUCKET/$dest/SHA256SUMS.pem"
          done

      # ---- Refresh the CDN's mutable pointers (Helm index, latest/, versions.json). Versioned
      #      artifacts are immutable and stay cached. No-op until RELEASES_CF_DISTRIBUTION_ID is set.
      - name: Invalidate CDN cache (mutable paths)
        if: vars.RELEASES_CF_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.RELEASES_CF_DISTRIBUTION_ID }}" \
            --paths /charts/reach-agent/index.yaml /agent/versions.json "/agent/latest/*"
